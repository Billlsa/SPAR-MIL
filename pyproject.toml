[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spar-mil"
version = "1.0.0"
description = "Spectral-spatial coordinate-aware multiple-instance learning model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

